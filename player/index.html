<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Агенты — плеер</title>
<style>
  :root { --bg: #0b0d18; --panel: #151a2c; --text: #e8f0ff; --dim: #7d8aa8; --accent: #7dff9a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
         font: 14px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; display: grid; place-items: center; padding: 16px; }
  main { width: min(100%, 1280px); }
  canvas { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; image-rendering: pixelated; border-radius: 6px; }
  .bar { display: flex; gap: 12px; align-items: center; margin-top: 10px; background: var(--panel); padding: 8px 12px; border-radius: 6px; flex-wrap: wrap; }
  button { background: var(--accent); color: #062010; border: 0; border-radius: 4px; width: 44px; height: 32px; font: inherit; font-size: 16px; cursor: pointer; }
  button:disabled { background: #33405a; color: var(--dim); cursor: wait; }
  input[type=range] { flex: 1; min-width: 160px; accent-color: var(--accent); }
  select { background: var(--bg); color: var(--text); border: 1px solid #33405a; border-radius: 4px; font: inherit; padding: 4px; }
  .meta { display: flex; justify-content: space-between; color: var(--dim); margin-top: 6px; gap: 12px; flex-wrap: wrap; }
  #time { min-width: 130px; }
</style>
</head>
<body>
<main>
  <canvas id="screen" width="960" height="540"></canvas>
  <div class="bar">
    <button id="play" disabled>▶</button>
    <input id="seek" type="range" min="0" value="0" step="1">
    <span id="time">0.00 / 45.00 s</span>
    <select id="res" title="разрешение рендера">
      <option value="960x540" selected>960×540</option>
      <option value="1920x1080">1920×1080</option>
      <option value="640x360">640×360</option>
    </select>
  </div>
  <div class="meta"><span id="shot"></span><span id="status"></span></div>
</main>
<script type="module" src="./player.js"></script>
</body>
</html>
